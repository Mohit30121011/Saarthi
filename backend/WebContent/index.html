    <style>.goog-te-banner-frame,.goog-te-banner-frame.skiptranslate,iframe.goog-te-banner-frame,#goog-gt-tt,.goog-te-balloon-frame,.goog-tooltip,.goog-tooltip:hover{visibility:hidden!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important;position:absolute!important;top:-9999px!important;left:-9999px!important}body{position:static!important;top:0!important}</style>

  <body class="bg-[#F8FAFC] text-[#111C2D] font-sans antialiased">
    <!-- Google Translate Invisible Engine Mount -->
    <div id="google_translate_element" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>
    <div id="root"></div>

    <!-- Enforce / Restore Active Language Session before Google Translate Bootstraps -->
    <script type="text/javascript">
      (function() {
        try {
          var sessionLang = sessionStorage.getItem('saarthi_language');
          if (!sessionLang || sessionLang === 'en') {
            sessionStorage.setItem('saarthi_language', 'en');
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'googtrans=/en/en; path=/;';
          } else {
            var targetCookie = '/en/' + sessionLang;
            document.cookie = 'googtrans=' + targetCookie + '; path=/;';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Official Multilingual Accessibility Engine (Google Translate) -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'en,hi,mr,gu,bn,ta,te,kn,ml,pa,ur,or,as,sa,ne,sd',
              autoDisplay: false,
            },
            'google_translate_element'
          );
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <!-- Auto-Protect Material Symbols and Logos from Translation Corruptions -->
    <script type="text/javascript">
      (function() {
        function protectIcons(root) {
          if (!root) return;
          if (root.nodeType === 1) {
            if (root.classList && (root.classList.contains('material-symbols-outlined') || root.classList.contains('font-mono'))) {
              root.classList.add('notranslate');
              root.setAttribute('translate', 'no');
            }
            if (root.querySelectorAll) {
              root.querySelectorAll('.material-symbols-outlined, .font-mono, [translate="no"]').forEach(function(el) {
                el.classList.add('notranslate');
                el.setAttribute('translate', 'no');
              });
            }
          }
        }
        document.addEventListener('DOMContentLoaded', function() {
          protectIcons(document.body);
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
              m.addedNodes.forEach(function(node) {
                protectIcons(node);
              });
            });
          });
          observer.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </body>
