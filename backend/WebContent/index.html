<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/saarthi-portal-logo-CyFA28ZS.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAARTHI — National Citizen Welfare &amp; Entitlement Registry</title>
    <meta name="description" content="Official Central and Maharashtra Government Citizen Welfare Discovery and Entitlement Registry Portal." />
    <!-- Fonts: Plus Jakarta Sans & Inter + Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-B-_5kLy6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D3KOwq1M.css">
  </head>
  <body class="bg-[#F8FAFC] text-[#111C2D] font-sans antialiased">
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <!-- Enforce Default Language: English upon project launch / initial session -->
    <script type="text/javascript">
      (function() {
        try {
          var sessionLang = sessionStorage.getItem('saarthi_language');
          if (!sessionLang || sessionLang === 'en') {
            sessionStorage.setItem('saarthi_language', 'en');
            localStorage.removeItem('saarthi_language');
            localStorage.removeItem('saarthi_selected_lang');
            var hostname = window.location.hostname;
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + hostname;
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.' + hostname;
            document.cookie = 'googtrans=/en/en; path=/;';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Official Multilingual Accessibility Engine (Google Translate) -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'en,hi,mr,gu,bn,ta,te,kn,ml,pa,ur,or,as,sa,ne,sd',
              autoDisplay: false,
            },
            'google_translate_element'
          );
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <!-- Auto-Protect Material Symbols and Logos from Translation Corruptions -->
    <script type="text/javascript">
      (function() {
        function protectIcons(root) {
          if (!root) return;
          if (root.nodeType === 1) {
            if (root.classList && (root.classList.contains('material-symbols-outlined') || root.classList.contains('font-mono'))) {
              root.classList.add('notranslate');
              root.setAttribute('translate', 'no');
            }
            if (root.querySelectorAll) {
              root.querySelectorAll('.material-symbols-outlined, .font-mono, [translate="no"]').forEach(function(el) {
                el.classList.add('notranslate');
                el.setAttribute('translate', 'no');
              });
            }
          }
        }
        document.addEventListener('DOMContentLoaded', function() {
          protectIcons(document.body);
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
              m.addedNodes.forEach(function(node) {
                protectIcons(node);
              });
            });
          });
          observer.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </body>
</html>
