<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'loose',
    flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis', nodeSpacing: 22, rankSpacing: 28, padding: 8 },
    er: { useMaxWidth: true }
  });

  const renderer = new marked.Renderer();
  const originalCode = renderer.code.bind(renderer);
  renderer.code = function(code, infostring, escaped) {
    if ((infostring || '').trim() === 'mermaid') {
      return '<pre class="mermaid">' + code + '</pre>';
    }
    return originalCode(code, infostring, escaped);
  };
  marked.setOptions({ renderer: renderer, gfm: true, tables: true });

  try {
    const b64 = document.getElementById('srs-b64').textContent.trim();
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const md = new TextDecoder('utf-8').decode(bytes);

    const lines = md.split('\n');
    let startIdx = 0;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('## 1. Introduction')) { startIdx = i; break; }
    }
    const trimmed = lines.slice(startIdx).join('\n');
    document.getElementById('content').innerHTML = marked.parse(trimmed);
    setTimeout(function() {
      const nodes = document.querySelectorAll('pre.mermaid');
      mermaid.run({ nodes: nodes }).then(() => {
        document.getElementById('status').textContent = 'done';
        document.title = 'RENDER_COMPLETE';
      }).catch(err => {
        document.getElementById('status').textContent = 'MERMAID ERROR: ' + (err && (err.message || err.str || JSON.stringify(err)));
      });
    }, 50);
  } catch (err) {
    document.getElementById('status').textContent = 'ERROR: ' + err;
    document.getElementById('content').innerHTML = '<pre>' + String(err) + '</pre>';
  }
</script>
